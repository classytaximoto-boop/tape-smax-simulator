- name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'

- name: Setup Java
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '17'

- name: Install npm dependencies
  run: npm install

- name: Install background geolocation plugin
  # IMPORTANT : sans ce package installé AVANT `npx cap add android`,
  # window.Capacitor.Plugins.BackgroundGeolocation reste undefined
  # dans l'app (NativeGpsNotif.getPlugin() ne trouve jamais rien) —
  # aucune notification GPS n'apparaît, silencieusement, sans erreur
  # visible côté JS ni côté build. `npx cap sync` synchronise les
  # plugins déjà présents dans node_modules, il ne les installe pas.
  run: npm install @capacitor-community/background-geolocation

- name: Prepare www folder
  run: |
    mkdir -p www
    cp Yamaha_Smax.html www/index.html
    cp manifest.json www/ || true
    cp icon-192.png www/ || true
    cp icon-512.png www/ || true
    cp engine_coolant_photo.jpg www/ || true

- name: Add Android platform
  run: npx cap add android

- name: Patch MainActivity to grant WebView media permissions
  run: |
    python3 - <<'EOF'
    import re, glob
    matches = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
    if not matches:
        print("WARNING: MainActivity.java not found, skipping")
    else:
        path = matches[0]
        with open(path) as f:
            content = f.read()

        if "import android.webkit.PermissionRequest;" not in content:
            content = content.replace(
                "import com.getcapacitor.BridgeActivity;",
                "import com.getcapacitor.BridgeActivity;\n"
                "import android.webkit.PermissionRequest;\n"
                "import android.webkit.WebChromeClient;\n"
                "import android.webkit.WebView;\n"
                "import android.webkit.GeolocationPermissions;\n"
                "import android.webkit.ValueCallback;\n"
                "import android.content.Intent;\n"
                "import android.Manifest;\n"
                "import android.content.pm.PackageManager;\n"
                "import androidx.core.app.ActivityCompat;\n"
                "import androidx.core.content.ContextCompat;\n"
                "import android.os.Build;"
            )

        if "filePathCallback" not in content:
            content = re.sub(
                r"(public class MainActivity extends BridgeActivity \{)",
                r"\1\n"
                r"    private ValueCallback<Uri[]> filePathCallback = null;\n"
                r"    private static final int FILE_CHOOSER_REQUEST_CODE = 1003;\n",
                content,
                count=1
            )
            # android.net.Uri est utilisé dans le type générique ci-dessus.
            if "import android.net.Uri;" not in content:
                content = content.replace(
                    "import android.content.Intent;",
                    "import android.content.Intent;\nimport android.net.Uri;"
                )

        if "pendingWebPermissionRequest" not in content:
            content = re.sub(
                r"(public class MainActivity extends BridgeActivity \{)",
                r"\1\n"
                r"    private PermissionRequest pendingWebPermissionRequest = null;\n"
                r"    private long pendingWebPermissionRequestAtMs = 0;\n",
                content,
                count=1
            )

        patch_snippet = (
            "\n        // Permissions runtime Android (popup système), nécessaires en plus\n"
            "        // du <uses-permission> du manifeste sur Android 6+.\n"
            "        //\n"
            "        // IMPORTANT : on NE demande PAS RECORD_AUDIO/CAMERA ici, au démarrage.\n"
            "        // Si on le fait, le popup système apparaît dès l'ouverture de l'app,\n"
            "        // hors contexte (l'utilisateur ne sait pas encore pourquoi le micro\n"
            "        // est demandé) — beaucoup de gens refusent par réflexe à ce moment-là.\n"
            "        // Or Android bloque ensuite tout re-déclenchement AUTOMATIQUE du popup\n"
            "        // pour cette permission une fois refusée une première fois : le bouton\n"
            "        // micro dans l'app reste alors cassé en PERMANENCE, même si\n"
            "        // l'utilisateur clique dessus plus tard et pense l'autoriser — car\n"
            "        // onPermissionRequest() voit la permission Android déjà DENIED et\n"
            "        // appelle request.deny() silencieusement à chaque tentative.\n"
            "        // RECORD_AUDIO/CAMERA sont donc demandées PLUS BAS, à la volée dans\n"
            "        // onPermissionRequest(), déclenché uniquement quand l'utilisateur\n"
            "        // appuie réellement sur le bouton micro/caméra dans l'app — c'est le\n"
            "        // seul moment où le contexte justifie le popup et où Android autorise\n"
            "        // encore un nouveau prompt.\n"
            "        //\n"
            "        // POST_NOTIFICATIONS (Android 13+ / API 33+) est déclarée dans le\n"
            "        // manifeste mais c'est une permission runtime \"dangerous\" comme les\n"
            "        // autres : sans cette demande explicite, NotificationManager.notify()\n"
            "        // échoue SILENCIEUSEMENT (aucune exception) sur Android 13+ — c'était\n"
            "        // la cause du bug \"aucune notification GPS n'apparaît nulle part\",\n"
            "        // même dans le tiroir de notifications standard écran déverrouillé.\n"
            "        //\n"
            "        // CORRECTIF MICRO : RECORD_AUDIO/CAMERA sont maintenant demandées ICI,\n"
            "        // dès le démarrage, EN PLUS de ACCESS_FINE_LOCATION/POST_NOTIFICATIONS,\n"
            "        // plutôt que d'attendre le clic sur le bouton MICRO dans\n"
            "        // onPermissionRequest() plus bas. Raison : PermissionRequest.grant()\n"
            "        // (l'API WebView qui débloque getUserMedia() côté JS) N'EST FIABLE QUE\n"
            "        // si elle est appelée quasi immédiatement après onPermissionRequest().\n"
            "        // Or le popup ActivityCompat.requestPermissions() prend un temps humain\n"
            "        // (l'utilisateur doit lire et taper \"Autoriser\") — pendant ce délai, le\n"
            "        // PermissionRequest original du WebView expire côté Chromium. Résultat\n"
            "        // observé : le popup système s'affiche, l'utilisateur autorise,\n"
            "        // Réglages → Apps → Autorisations confirme bien Micro = Autorisé, MAIS\n"
            "        // la promesse JS getUserMedia() ne se résout JAMAIS (ni succès, ni\n"
            "        // erreur) — le bouton MICRO reste bloqué sans rien afficher. En\n"
            "        // demandant la permission ICI, au démarrage, la permission Android est\n"
            "        // déjà accordée AVANT que l'utilisateur n'appuie sur MICRO : quand\n"
            "        // onPermissionRequest() se déclenche alors, audioGranted est déjà true\n"
            "        // et request.grant() est appelé en quelques millisecondes, bien avant\n"
            "        // toute expiration.\n"
            "        java.util.List<String> neededPermsList = new java.util.ArrayList<>(java.util.Arrays.asList(\n"
            "            Manifest.permission.ACCESS_FINE_LOCATION,\n"
            "            Manifest.permission.ACCESS_COARSE_LOCATION,\n"
            "            Manifest.permission.RECORD_AUDIO\n"
            "        ));\n"
            "        if (Build.VERSION.SDK_INT >= 33) {\n"
            "            neededPermsList.add(Manifest.permission.POST_NOTIFICATIONS);\n"
            "        }\n"
            "        String[] neededPerms = neededPermsList.toArray(new String[0]);\n"
            "        java.util.List<String> toRequest = new java.util.ArrayList<>();\n"
            "        for (String p : neededPerms) {\n"
            "            if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {\n"
            "                toRequest.add(p);\n"
            "            }\n"
            "        }\n"
            "        if (!toRequest.isEmpty()) {\n"
            "            ActivityCompat.requestPermissions(this, toRequest.toArray(new String[0]), 1001);\n"
            "        }\n"
            "\n        WebView webView = this.bridge.getWebView();\n"
            "        webView.post(() -> {\n"
            "            // IMPORTANT : sans ce DownloadListener, un WebView Android natif\n"
            "            // ignore SILENCIEUSEMENT tout clic JS sur <a download> (comme dans\n"
            "            // smaxExportData()) — contrairement à un onglet Chrome classique.\n"
            "            // Le Blob est bien créé côté JS, le clic part bien, mais rien\n"
            "            // n'apparaît jamais sur le disque : ceci branche ces téléchargements\n"
            "            // sur le DownloadManager système Android, qui écrit le fichier dans\n"
            "            // le dossier public Téléchargements.\n"
            "            webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {\n"
            "                try {\n"
            "                    android.app.DownloadManager.Request req;\n"
            "                    String filename = android.webkit.URLUtil.guessFileName(url, contentDisposition, mimetype);\n"
            "                    if (url.startsWith(\"blob:\")) {\n"
            "                        // Un blob: URL n'est valide que dans le contexte JS qui l'a créé —\n"
            "                        // DownloadManager ne peut pas le récupérer directement depuis\n"
            "                        // Java. On relit donc le Blob en JS et on le repasse en base64\n"
            "                        // via une interface JS→Java, qui écrit ensuite le vrai fichier.\n"
            "                        webView.evaluateJavascript(\n"
            "                            \"(function(){\" +\n\"\" +\n"
            "                            \"fetch('\" + url + \"').then(r => r.blob()).then(b => {\" +\n"
            "                            \"var reader = new FileReader();\" +\n"
            "                            \"reader.onloadend = function(){ AndroidDownload.saveBase64(reader.result, '\" + filename + \"'); };\" +\n"
            "                            \"reader.readAsDataURL(b);\" +\n"
            "                            \"});\" +\n"
            "                            \"})();\", null);\n"
            "                    } else {\n"
            "                        req = new android.app.DownloadManager.Request(android.net.Uri.parse(url));\n"
            "                        req.setMimeType(mimetype);\n"
            "                        req.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);\n"
            "                        req.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, filename);\n"
            "                        android.app.DownloadManager dm = (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);\n"
            "                        if (dm != null) dm.enqueue(req);\n"
            "                    }\n"
            "                } catch (Exception dlErr) {\n"
            "                    android.util.Log.e(\"SMAX155\", \"Téléchargement échoué\", dlErr);\n"
            "                }\n"
            "            });\n"
            "            webView.addJavascriptInterface(new Object() {\n"
            "                @android.webkit.JavascriptInterface\n"
            "                public void saveBase64(String dataUrl, String filename) {\n"
            "                    try {\n"
            "                        String base64 = dataUrl.substring(dataUrl.indexOf(\",\") + 1);\n"
            "                        byte[] bytes = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);\n"
            "                        java.io.File dir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS);\n"
            "                        if (!dir.exists()) dir.mkdirs();\n"
            "                        java.io.File outFile = new java.io.File(dir, filename);\n"
            "                        try (java.io.FileOutputStream fos = new java.io.FileOutputStream(outFile)) {\n"
            "                            fos.write(bytes);\n"
            "                        }\n"
            "                        runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this,\n"
            "                            \"Enregistré dans Téléchargements : \" + filename, android.widget.Toast.LENGTH_LONG).show());\n"
            "                    } catch (Exception saveErr) {\n"
            "                        android.util.Log.e(\"SMAX155\", \"saveBase64 échoué\", saveErr);\n"
            "                    }\n"
            "                }\n"
            "            }, \"AndroidDownload\");\n"
            "            webView.setWebChromeClient(new WebChromeClient() {\n"
            "                @Override\n"
            "                public void onPermissionRequest(final PermissionRequest request) {\n"
            "                    // IMPORTANT : request.grant() ne DOIT être appelé que pour des\n"
            "                    // ressources dont la permission Android runtime correspondante\n"
            "                    // est déjà réellement accordée.\n"
            "                    android.util.Log.d(\"SMAX155-Perm\", \"onPermissionRequest reçu pour: \" + java.util.Arrays.toString(request.getResources()));\n"
            "                    runOnUiThread(() -> {\n"
            "                        boolean audioWanted = false, videoWanted = false;\n"
            "                        for (String res : request.getResources()) {\n"
            "                            if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res)) audioWanted = true;\n"
            "                            if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res)) videoWanted = true;\n"
            "                        }\n"
            "\n"
            "                        boolean audioGranted = ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED;\n"
            "                        boolean videoGranted = ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;\n"
            "\n"
            "                        java.util.List<String> granted = new java.util.ArrayList<>();\n"
            "                        if (audioWanted && audioGranted) granted.add(PermissionRequest.RESOURCE_AUDIO_CAPTURE);\n"
            "                        if (videoWanted && videoGranted) granted.add(PermissionRequest.RESOURCE_VIDEO_CAPTURE);\n"
            "\n"
            "                        boolean stillMissing = (audioWanted && !audioGranted) || (videoWanted && !videoGranted);\n"
            "\n"
            "                        if (!stillMissing && !granted.isEmpty()) {\n"
            "                            // Tout ce qui est demandé est déjà accordé côté Android.\n"
            "                            // C'est désormais le cas normal pour le micro depuis le\n"
            "                            // correctif ci-dessus (RECORD_AUDIO demandée au démarrage) :\n"
            "                            // grant() est appelé immédiatement, sans traverser le\n"
            "                            // chemin ActivityCompat.requestPermissions() plus bas, qui\n"
            "                            // est ce qui causait l'expiration silencieuse du\n"
            "                            // PermissionRequest pendant l'attente humaine du popup.\n"
            "                            android.util.Log.d(\"SMAX155-Perm\", \"grant() immédiat: \" + granted);\n"
            "                            request.grant(granted.toArray(new String[0]));\n"
            "                            return;\n"
            "                        }\n"
            "\n"
            "                        // Au moins une ressource demandée n'a pas encore de permission\n"
            "                        // Android accordée. Plutôt que de refuser définitivement (ce qui\n"
            "                        // bloquait tout getUserMedia ultérieur même après acceptation),\n"
            "                        // on relance le popup système runtime et on met CETTE requête\n"
            "                        // WebView en attente : elle sera résolue (grant ou deny) plus\n"
            "                        // tard, une fois la réponse connue.\n"
            "                        java.util.List<String> toReRequest = new java.util.ArrayList<>();\n"
            "                        if (audioWanted && !audioGranted) toReRequest.add(Manifest.permission.RECORD_AUDIO);\n"
            "                        if (videoWanted && !videoGranted) toReRequest.add(Manifest.permission.CAMERA);\n"
            "\n"
            "                        if (!toReRequest.isEmpty()) {\n"
            "                            // IMPORTANT : si un popup Android est déjà affiché à\n"
            "                            // l'écran pour une requête WebView précédente (l'utilisateur\n"
            "                            // n'a pas encore répondu), on N'ANNULE PAS ce popup pour en\n"
            "                            // relancer un nouveau ici. Remplacer un popup déjà affiché\n"
            "                            // pendant que l'utilisateur est justement en train d'y\n"
            "                            // répondre fait que son clic \"Autoriser\" résout la MAUVAISE\n"
            "                            // requête WebView (celle qui vient de la remplacer) — cause\n"
            "                            // exacte du bug observé où le popup est accepté mais le\n"
            "                            // micro reste marqué refusé/déjà utilisé de façon aléatoire.\n"
            "                            // On se contente donc d'ignorer cette nouvelle requête\n"
            "                            // WebView tant que l'ancienne n'est pas résolue : le JS\n"
            "                            // (micRequestStream/toggleMicDetector) retente déjà tout\n"
            "                            // seul après un délai suffisant.\n"
            "                            //\n"
            "                            // CORRECTIF : si l'utilisateur ferme/ignore le popup système\n"
            "                            // sans jamais répondre (retour arrière, verrouillage d'écran,\n"
            "                            // changement d'app), onRequestPermissionsResult() peut ne\n"
            "                            // JAMAIS être appelé pour cette requête — pendingWebPermissionRequest\n"
            "                            // restait alors bloqué à une valeur non-null pour toujours,\n"
            "                            // et TOUTES les tentatives suivantes (même après avoir accepté\n"
            "                            // la permission une fois) tombaient dans ce bloc et étaient\n"
            "                            // ignorées silencieusement en aval, sans jamais grant() ni\n"
            "                            // deny() la nouvelle requête — le popup se réaffichait, le clic\n"
            "                            // \"Autoriser\" n'avait plus aucun effet observable. On détecte\n"
            "                            // donc une requête bloquée depuis trop longtemps et on la\n"
            "                            // refuse explicitement pour libérer la voie à celle-ci. ─────\n"
            "                            long now = android.os.SystemClock.elapsedRealtime();\n"
            "                            if (pendingWebPermissionRequest != null\n"
            "                                && (now - pendingWebPermissionRequestAtMs) > 15000) {\n"
            "                                android.util.Log.d(\"SMAX155-Perm\", \"deny() par timeout watchdog (15s dépassées)\");\n"
            "                                try { pendingWebPermissionRequest.deny(); } catch (Exception ignored) {}\n"
            "                                pendingWebPermissionRequest = null;\n"
            "                            }\n"
            "                            if (pendingWebPermissionRequest != null) {\n"
            "                                return;\n"
            "                            }\n"
            "                            pendingWebPermissionRequest = request;\n"
            "                            pendingWebPermissionRequestAtMs = now;\n"
            "                            ActivityCompat.requestPermissions(MainActivity.this,\n"
            "                                toReRequest.toArray(new String[0]), 1002);\n"
            "                        } else {\n"
            "                            request.deny();\n"
            "                        }\n"
            "                    });\n"
            "                }\n"
            "                @Override\n"
            "                public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {\n"
            "                    // Même logique que ci-dessus : on ne dit \"allow=true\" au WebView\n"
            "                    // que si la permission Android est réellement déjà accordée.\n"
            "                    boolean hasLoc = ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED\n"
            "                        || ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;\n"
            "                    runOnUiThread(() -> callback.invoke(origin, hasLoc, false));\n"
            "                }\n"
            "                @Override\n"
            "                public boolean onShowFileChooser(WebView webViewParam, ValueCallback<Uri[]> filePathCallbackParam, FileChooserParams fileChooserParams) {\n"
            "                    // IMPORTANT : sans cette surcharge, un WebView Android natif\n"
            "                    // ignore SILENCIEUSEMENT tout clic JS sur <input type=\"file\">\n"
            "                    // (comme le bouton \"Importer\" de smaxImportData()) — le clic JS\n"
            "                    // part bien (input.click() s'exécute), mais aucun sélecteur de\n"
            "                    // fichiers système ne s'ouvre jamais, sans la moindre erreur JS.\n"
            "                    // C'est le pendant exact du DownloadListener ci-dessus, mais pour\n"
            "                    // l'upload plutôt que le download.\n"
            "                    if (MainActivity.this.filePathCallback != null) {\n"
            "                        MainActivity.this.filePathCallback.onReceiveValue(null);\n"
            "                    }\n"
            "                    MainActivity.this.filePathCallback = filePathCallbackParam;\n"
            "                    Intent intent = fileChooserParams.createIntent();\n"
            "                    try {\n"
            "                        startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);\n"
            "                    } catch (android.content.ActivityNotFoundException e) {\n"
            "                        MainActivity.this.filePathCallback = null;\n"
            "                        return false;\n"
            "                    }\n"
            "                    return true;\n"
            "                }\n"
            "            });\n"
            "        });"
        )

        permission_result_snippet = (
            "\n\n    @Override\n"
            "    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {\n"
            "        super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n"
            "\n"
            "        if (requestCode == 1002) {\n"
            "            PermissionRequest req = pendingWebPermissionRequest;\n"
            "            pendingWebPermissionRequest = null;\n"
            "            if (req == null) return;\n"
            "\n"
            "            // IMPORTANT : on lit le résultat directement depuis permissions[]/\n"
            "            // grantResults[] (la réponse exacte et synchrone que le système vient\n"
            "            // de renvoyer pour CETTE demande), plutôt que de rappeler\n"
            "            // checkSelfPermission() ici. Sur plusieurs surcouches Android\n"
            "            // (MIUI/Xiaomi, ColorOS/Oppo, et d'autres avec des réglages de\n"
            "            // confidentialité renforcés), checkSelfPermission() peut encore\n"
            "            // renvoyer DENIED une fraction de seconde après que l'utilisateur a\n"
            "            // accepté le popup — le nouvel état de permission n'a pas fini de se\n"
            "            // propager côté système au moment où ce callback s'exécute. Résultat\n"
            "            // observé : le popup système s'affiche, l'utilisateur tape\n"
            "            // \"Autoriser\", mais request.deny() est quand même appelé et\n"
            "            // Réglages → Apps → Autorisations affiche Micro = Refusé alors que\n"
            "            // l'utilisateur vient d'accepter. grantResults[] ne souffre pas de ce\n"
            "            // délai de propagation : c'est la réponse déjà tranchée.\n"
            "            boolean audioGranted = false, videoGranted = false;\n"
            "            for (int i = 0; i < permissions.length; i++) {\n"
            "                boolean isGranted = i < grantResults.length && grantResults[i] == PackageManager.PERMISSION_GRANTED;\n"
            "                if (Manifest.permission.RECORD_AUDIO.equals(permissions[i]) && isGranted) audioGranted = true;\n"
            "                if (Manifest.permission.CAMERA.equals(permissions[i]) && isGranted) videoGranted = true;\n"
            "            }\n"
            "\n"
            "            java.util.List<String> granted = new java.util.ArrayList<>();\n"
            "            for (String res : req.getResources()) {\n"
            "                if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) && audioGranted) granted.add(res);\n"
            "                if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) && videoGranted) granted.add(res);\n"
            "            }\n"
            "            if (!granted.isEmpty()) {\n"
            "                android.util.Log.d(\"SMAX155-Perm\", \"grant() différé (après popup runtime): \" + granted);\n"
            "                req.grant(granted.toArray(new String[0]));\n"
            "            } else {\n"
            "                android.util.Log.d(\"SMAX155-Perm\", \"deny() différé (permission refusée par l'utilisateur)\");\n"
            "                req.deny();\n"
            "            }\n"
            "            return;\n"
            "        }\n"
            "\n"
            "        if (requestCode == 1001) {\n"
            "            boolean anyGranted = false;\n"
            "            for (int r : grantResults) {\n"
            "                if (r == PackageManager.PERMISSION_GRANTED) { anyGranted = true; break; }\n"
            "            }\n"
            "            if (anyGranted) {\n"
            "                WebView wv = this.bridge.getWebView();\n"
            "                if (wv != null) wv.post(wv::reload);\n"
            "            }\n"
            "        }\n"
            "    }"
        )

        if "onPermissionRequest" not in content:
            if "super.onCreate(savedInstanceState);" in content:
                content = content.replace(
                    "super.onCreate(savedInstanceState);",
                    "super.onCreate(savedInstanceState);" + patch_snippet,
                    1
                )
            else:
                content = re.sub(
                    r"(public class MainActivity extends BridgeActivity \{)",
                    r"\1\n"
                    r"    @Override\n"
                    r"    protected void onCreate(android.os.Bundle savedInstanceState) {\n"
                    r"        super.onCreate(savedInstanceState);" + patch_snippet + "\n"
                    r"    }\n",
                    content,
                    count=1
                )

        activity_result_snippet = (
            "\n\n    @Override\n"
            "    public void onActivityResult(int requestCode, int resultCode, Intent data) {\n"
            "        super.onActivityResult(requestCode, resultCode, data);\n"
            "        if (requestCode == FILE_CHOOSER_REQUEST_CODE) {\n"
            "            if (filePathCallback == null) return;\n"
            "            Uri[] results = null;\n"
            "            if (resultCode == RESULT_OK && data != null) {\n"
            "                String dataString = data.getDataString();\n"
            "                if (dataString != null) {\n"
            "                    results = new Uri[]{ Uri.parse(dataString) };\n"
            "                } else if (data.getClipData() != null) {\n"
            "                    int count = data.getClipData().getItemCount();\n"
            "                    results = new Uri[count];\n"
            "                    for (int i = 0; i < count; i++) {\n"
            "                        results[i] = data.getClipData().getItemAt(i).getUri();\n"
            "                    }\n"
            "                }\n"
            "            }\n"
            "            filePathCallback.onReceiveValue(results);\n"
            "            filePathCallback = null;\n"
            "        }\n"
            "    }"
        )

        if "onRequestPermissionsResult" not in content:
            last_brace = content.rfind("}")
            if last_brace != -1:
                content = content[:last_brace] + permission_result_snippet + activity_result_snippet + "\n" + content[last_brace:]

        with open(path, "w") as f:
            f.write(content)
        print("MainActivity.java patched:", path)
        print("----- FULL FILE CONTENT -----")
        print(content)
        print("----- END FILE CONTENT -----")
    EOF

- name: Prepare source assets for icon/splash generation
  run: |
    # @capacitor/assets generate --android ne lit PAS icon-192.png /
    # icon-512.png (ceux-là servent uniquement au manifest.json du
    # PWA web). Il exige ses PROPRES fichiers sources dans un dossier
    # assets/ dédié à la racine du repo :
    #   assets/icon.png    (minimum 1024x1024px, carré, exigé par l'outil)
    #   assets/splash.png  (optionnel, sinon un splash par défaut est
    #                       généré)
    # Si ce dossier n'existe pas, ou si l'icône source est plus
    # petite que 1024x1024, la commande échoue silencieusement
    # (erreur noyée dans les warnings npm de l'installation à la
    # volée du package @capacitor/assets), ce qui donnait
    # "exit code 1" sans explication claire.
    mkdir -p assets
    if [ ! -f icon-512.png ]; then
      echo "ERREUR : icon-512.png introuvable à la racine du repo."
      echo "@capacitor/assets a besoin d'un fichier source carré (min 1024x1024)"
      echo "pour générer les icônes natives Android."
      exit 1
    fi

    pip install --break-system-packages --quiet Pillow

    python3 - <<'EOF'
    from PIL import Image
    src = Image.open("icon-512.png").convert("RGBA")
    w, h = src.size
    print(f"Icône source détectée : icon-512.png = {w}x{h}px, mode {src.mode}")

    # @capacitor/assets exige un minimum de 1024x1024px pour les
    # icônes sources. icon-512.png (512x512) est trop petit et fait
    # planter l'outil sans message clair. On agrandit donc à 1024x1024
    # (upscale simple, qualité suffisante pour une icône d'app —
    # ce n'est pas destiné à être imprimé en grand format).
    target = 1024
    side = max(w, h, target)
    resized = src.resize((side, side), Image.LANCZOS)
    resized.save("assets/icon.png")
    print(f"assets/icon.png créé : {side}x{side}px")
    EOF

    echo "----- Contenu de assets/ -----"
    ls -la assets/
    file assets/icon.png

- name: Generate native icons & splash screen
  run: |
    set -x
    npx @capacitor/assets generate --android --assetPath assets 2>&1
    exit_code=$?
    echo "Exit code: $exit_code"
    exit $exit_code

