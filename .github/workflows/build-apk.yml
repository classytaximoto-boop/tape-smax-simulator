name: Build Yamaha Smax APK (enhanced)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android@6.1.2

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy web files and sync
        run: |
          npx cap copy android
          npx cap sync android

      - name: Add microphone permission (robust)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERM='<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if ! grep -q "$PERM" "$MANIFEST"; then
            sed -i "/<manifest /a \    $PERM" "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # Optionnel : build release avec signature (désactivé par défaut)
      # - name: Decode keystore
      #   run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Optionnel : build release
      # - name: Build release APK
      #   working-directory: android
      #   run: ./gradlew assembleRelease --no-daemon
      #   env:
      #     KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: Yamaha-Smax-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Optionnel : upload release
