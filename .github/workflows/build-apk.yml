name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp Yamaha_Smax.html www/index.html
          cp manifest.json www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/ || true
          cp engine_coolant_photo.jpg www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Patch MainActivity to grant WebView media permissions
        run: |
          python3 - <<'EOF'
          import re, glob
          matches = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if not matches:
              print("WARNING: MainActivity.java not found, skipping")
          else:
              path = matches[0]
              with open(path) as f:
                  content = f.read()

              if "import android.webkit.PermissionRequest;" not in content:
                  content = content.replace(
                      "import com.getcapacitor.BridgeActivity;",
                      "import com.getcapacitor.BridgeActivity;\n"
                      "import android.webkit.PermissionRequest;\n"
                      "import android.webkit.WebChromeClient;\n"
                      "import android.webkit.WebView;\n"
                      "import android.webkit.GeolocationPermissions;\n"
                      "import android.Manifest;\n"
                      "import android.content.pm.PackageManager;\n"
                      "import androidx.core.app.ActivityCompat;\n"
                      "import androidx.core.content.ContextCompat;"
                  )

              patch_snippet = (
                  "\n        // Permissions runtime Android (popup système), nécessaires en plus\n"
                  "        // du <uses-permission> du manifeste sur Android 6+.\n"
                  "        String[] neededPerms = new String[] {\n"
                  "            Manifest.permission.ACCESS_FINE_LOCATION,\n"
                  "            Manifest.permission.ACCESS_COARSE_LOCATION,\n"
                  "            Manifest.permission.RECORD_AUDIO,\n"
                  "            Manifest.permission.CAMERA\n"
                  "        };\n"
                  "        java.util.List<String> toRequest = new java.util.ArrayList<>();\n"
                  "        for (String p : neededPerms) {\n"
                  "            if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {\n"
                  "                toRequest.add(p);\n"
                  "            }\n"
                  "        }\n"
                  "        if (!toRequest.isEmpty()) {\n"
                  "            ActivityCompat.requestPermissions(this, toRequest.toArray(new String[0]), 1001);\n"
                  "        }\n"
                  "\n        WebView webView = this.bridge.getWebView();\n"
                  "        webView.post(() -> {\n"
                  "            webView.setWebChromeClient(new WebChromeClient() {\n"
                  "                @Override\n"
                  "                public void onPermissionRequest(final PermissionRequest request) {\n"
                  "                    runOnUiThread(() -> request.grant(request.getResources()));\n"
                  "                }\n"
                  "                @Override\n"
                  "                public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {\n"
                  "                    // onPermissionRequest (ci-dessus) ne couvre QUE le micro/caméra —\n"
                  "                    // la géolocalisation passe par cette méthode séparée, sans\n"
                  "                    // laquelle navigator.geolocation échoue toujours en WebView,\n"
                  "                    // même si la permission Android système est accordée.\n"
                  "                    runOnUiThread(() -> callback.invoke(origin, true, false));\n"
                  "                }\n"
                  "            });\n"
                  "        });"
              )

              if "onPermissionRequest" not in content:
                  if "super.onCreate(savedInstanceState);" in content:
                      content = content.replace(
                          "super.onCreate(savedInstanceState);",
                          "super.onCreate(savedInstanceState);" + patch_snippet,
                          1
                      )
                  else:
                      content = re.sub(
                          r"(public class MainActivity extends BridgeActivity \{)",
                          r"\1\n"
                          r"    @Override\n"
                          r"    protected void onCreate(android.os.Bundle savedInstanceState) {\n"
                          r"        super.onCreate(savedInstanceState);" + patch_snippet + "\n"
                          r"    }\n",
                          content,
                          count=1
                      )

              with open(path, "w") as f:
                  f.write(content)
              print("MainActivity.java patched:", path)
              print("----- FULL FILE CONTENT -----")
              print(content)
              print("----- END FILE CONTENT -----")
          EOF

      - name: Generate native icons & splash screen
        run: npx @capacitor/assets generate --android

      - name: Add native permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          """
          content = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, content, count=1)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Set status bar & navigation bar color
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/res/values/styles.xml"
          with open(path) as f:
              content = f.read()

          items = (
              '\n        <item name="android:statusBarColor">#f4d000</item>'
              '\n        <item name="android:navigationBarColor">#f4d000</item>'
              '\n        <item name="android:windowLightStatusBar">true</item>'
              '\n        <item name="android:windowLightNavigationBar">true</item>'
          )

          idx = content.find("</style>")
          if idx != -1:
              content = content[:idx] + items + "\n    " + content[idx:]
              with open(path, "w") as f:
                  f.write(content)
              print("styles.xml patched")
          else:
              print("WARNING: </style> not found, styles.xml left unchanged")
          EOF

      - name: Pin target/compile SDK to 34
        run: |
          python3 - <<'EOF'
          import re
          path = "android/variables.gradle"
          try:
              with open(path) as f:
                  content = f.read()
          except FileNotFoundError:
              print("variables.gradle not found, skipping")
          else:
              content = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 34", content)
              content = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", content)
              with open(path, "w") as f:
                  f.write(content)
              print("variables.gradle patched to SDK 34")
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smax155-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
