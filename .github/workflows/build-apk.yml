name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp Yamaha_Smax.html www/index.html
          cp manifest.json www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/ || true
          cp engine_coolant_photo.jpg www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native icons & splash screen
        run: npx @capacitor/assets generate --android

      - name: Add native permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          """
          content = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, content, count=1)

          service_tag = (
              '\n        <service\n'
              '            android:name="com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService"\n'
              '            android:enabled="true"\n'
              '            android:exported="true"\n'
              '            android:foregroundServiceType="location" />\n'
          )
          if 'BackgroundGeolocationService' not in content:
              content = re.sub(r'(<application[^>]*>)', r'\1' + service_tag, content, count=1)

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Set status bar & navigation bar color
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/res/values/styles.xml"
          with open(path) as f:
              content = f.read()

          items = (
              '\n        <item name="android:statusBarColor">#f4d000</item>'
              '\n        <item name="android:navigationBarColor">#f4d000</item>'
              '\n        <item name="android:windowLightStatusBar">true</item>'
              '\n        <item name="android:windowLightNavigationBar">true</item>'
          )

          idx = content.find("</style>")
          if idx != -1:
              content = content[:idx] + items + "\n    " + content[idx:]
              with open(path, "w") as f:
                  f.write(content)
              print("styles.xml patched")
          else:
              print("WARNING: </style> not found, styles.xml left unchanged")
          EOF

      - name: Pin target/compile SDK to 34
        run: |
          python3 - <<'EOF'
          import re
          path = "android/variables.gradle"
          try:
              with open(path) as f:
                  content = f.read()
          except FileNotFoundError:
              print("variables.gradle not found, skipping")
          else:
              content = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 34", content)
              content = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 34", content)
              with open(path, "w") as f:
                  f.write(content)
              print("variables.gradle patched to SDK 34")
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smax155-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
