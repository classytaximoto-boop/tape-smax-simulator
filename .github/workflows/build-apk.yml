name: Build Yamaha Smax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor Android
        run: npm install @capacitor/android@6.1.2

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f Yamaha_Smax.html ]; then
            cp Yamaha_Smax.html www/index.html
          elif [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "Erreur: aucun fichier HTML source trouvé (Yamaha_Smax.html ou index.html)"
            exit 1
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy web files to Android
        run: npx cap copy android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if permission not in text:
              match = re.search(r'<manifest\b[^>]*>', text)
              if not match:
                  raise SystemExit("Balise <manifest> introuvable dans AndroidManifest.xml")
              insert_pos = match.end()
              text = text[:insert_pos] + '\n    ' + permission + text[insert_pos:]
              p.write_text(text)

          print(p.read_text())
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamaha-Smax-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
